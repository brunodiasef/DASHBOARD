<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Painel — Meus Aplicativos</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161c">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Painel de Aplicativos">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#14161c;
    --bg-panel:#1c2029;
    --bg-panel-2:#20242e;
    --border:#2a2f3a;
    --border-soft:#252a34;
    --text:#edeef2;
    --text-muted:#8b93a7;
    --text-faint:#565d6e;
    --teal:#4fd1c5;
    --amber:#f2a65a;
    --violet:#9b8cff;
    --coral:#ff7a7a;
    --lime:#b8e986;
    --blue:#6fa8ff;
    --radius:12px;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.25);
    --shadow-md:0 8px 24px -8px rgba(0,0,0,0.5);
    --shadow-lg:0 16px 40px -12px rgba(0,0,0,0.6);
    --ease:cubic-bezier(.2,.8,.2,1);
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    --safe-left:env(safe-area-inset-left, 0px);
    --safe-right:env(safe-area-inset-right, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0) 0 0/22px 22px,
      var(--bg-base);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button, input{ font-family:inherit; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--teal); outline-offset:2px;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    padding:calc(var(--safe-top) + 16px) max(20px, var(--safe-right)) 14px max(20px, var(--safe-left));
    background:rgba(20,22,28,0.92);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
  }
  .brand{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    max-width:1240px; margin:0 auto 12px;
  }
  .brand-center{
    display:flex; align-items:center; justify-content:center; gap:10px;
    flex:1; min-width:0;
  }
  .brand .lamp{
    width:10px; height:10px; border-radius:50%; flex:none;
    background:var(--text-faint);
    box-shadow:none;
    animation:none;
  }
  .brand .lamp.pulse{ animation:blink 3.2s ease-in-out infinite; }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .brand h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:clamp(16px, 4.6vw, 22px); letter-spacing:clamp(0.5px, 0.4vw, 2px); margin:0;
    text-transform:uppercase; text-align:center; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .install-btn-header{
    padding:9px 16px; font-size:12.5px; border-radius:20px; flex:none;
    box-shadow:var(--shadow-sm);
  }
  .install-btn-header.installed{
    background:var(--bg-panel); color:var(--text-muted); border:1px solid var(--border);
    cursor:default; box-shadow:none;
  }

  .backup-actions{
    display:flex; gap:8px; flex:none;
  }
  .icon-only-btn{
    width:36px; height:36px; border-radius:50%; flex:none;
    background:var(--bg-panel); border:1px solid var(--border); color:var(--text-muted);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:border-color .15s var(--ease), color .15s var(--ease), transform .15s var(--ease);
    box-shadow:var(--shadow-sm);
  }
  .icon-only-btn:hover{border-color:var(--teal); color:var(--text); transform:translateY(-1px);}
  .icon-only-btn:active{transform:translateY(0) scale(0.94);}
  .icon-only-btn input[type=file]{display:none;}

  .controls-row{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; max-width:1240px; margin:0 auto;}
  .search-wrap{position:relative; flex:1; min-width:0; max-width:280px;}
  .search-wrap input{
    width:100%;
    background:var(--bg-panel); border:1px solid var(--border);
    color:var(--text); border-radius:9px; padding:11px 14px 11px 34px;
    font-size:14px; font-family:'Inter',sans-serif; min-height:44px;
    outline:none; transition:border-color .15s var(--ease);
  }
  .search-wrap input:focus{border-color:var(--teal);}
  .search-wrap svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:0.5; pointer-events:none;}

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    border:1px solid var(--border); background:var(--bg-panel);
    color:var(--text); font-family:'Inter',sans-serif; font-weight:500;
    font-size:13px; padding:10px 16px; border-radius:9px; cursor:pointer;
    min-height:40px;
    transition:transform .15s var(--ease), border-color .15s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease);
    box-shadow:var(--shadow-sm);
  }
  .btn:hover{border-color:var(--teal); transform:translateY(-1px); box-shadow:var(--shadow-md);}
  .btn:active{transform:translateY(0);}
  .btn-primary{
    background:linear-gradient(135deg,var(--teal),#3bb8ac);
    color:#0d1512; border:none; font-weight:600;
  }
  .btn-primary:hover{filter:brightness(1.08); transform:translateY(-1px);}
  .btn-ghost{background:transparent; box-shadow:none;}
  .btn-danger:hover{border-color:var(--coral);}

  /* ---------- New block panel ---------- */
  .new-block-panel{
    max-width:1240px; margin:0 auto; padding:0 28px;
  }
  .new-block-form{
    display:none; gap:10px; align-items:center; flex-wrap:wrap;
    background:var(--bg-panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:14px 16px; margin:16px 0 4px;
  }
  .new-block-form.open{display:flex;}
  .new-block-form input[type=text]{
    flex:1; min-width:160px;
    background:var(--bg-panel-2); border:1px solid var(--border);
    color:var(--text); border-radius:8px; padding:11px 12px; font-size:14px;
    min-height:44px;
    outline:none; transition:border-color .15s var(--ease);
  }
  .new-block-form input[type=text]:focus{border-color:var(--teal);}
  .swatches{display:flex; gap:7px;}
  .swatch{
    width:22px; height:22px; border-radius:50%; cursor:pointer;
    border:2px solid transparent; transition:transform .1s;
  }
  .swatch.active{border-color:#fff; transform:scale(1.12);}

  /* ---------- Grid ---------- */
  .grid{
    max-width:1240px; margin:0 auto; padding:20px 28px 90px;
    display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:18px; align-items:start;
  }
  .empty-state{
    max-width:1240px; margin:60px auto; text-align:center; padding:0 28px;
  }
  .empty-state .icon{font-size:34px; margin-bottom:10px;}
  .empty-state h2{font-family:'Space Grotesk',sans-serif; font-size:18px; margin:0 0 6px;}
  .empty-state p{color:var(--text-muted); font-size:14px; margin:0 0 18px;}

  /* ---------- Block card ---------- */
  .block-card{
    background:var(--bg-panel);
    border:1px solid var(--border);
    border-left:4px solid var(--block-color, var(--teal));
    border-radius:var(--radius);
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  .block-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 14px 12px 16px;
    border-bottom:1px solid var(--border-soft);
  }
  .block-head-left{display:flex; align-items:center; gap:9px; min-width:0;}
  .block-led{
    width:8px; height:8px; border-radius:50%; flex:none;
    background:var(--block-color, var(--teal));
    box-shadow:0 0 6px 1px var(--block-color, var(--teal));
  }
  .block-title{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14.5px;
    letter-spacing:0.3px; text-transform:uppercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .block-count{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-faint);
    flex:none;
  }
  .icon-btn{
    background:none; border:none; color:var(--text-faint); cursor:pointer;
    padding:4px; border-radius:6px; display:flex; align-items:center;
    transition:color .12s, background .12s;
  }
  .icon-btn:hover{color:var(--coral); background:rgba(255,122,122,0.1);}

  .app-list{
    padding:14px 12px 6px; display:grid;
    grid-template-columns:repeat(auto-fill,minmax(76px,1fr));
    gap:14px 8px;
  }
  .app-tile{
    display:flex; flex-direction:column; align-items:center; gap:7px;
    cursor:pointer; position:relative; padding:4px 2px 0;
    border-radius:10px; transition:transform .15s var(--ease);
  }
  .app-tile:hover{transform:translateY(-3px);}
  .app-tile:active{transform:translateY(-1px);}
  .app-icon-wrap{
    width:58px; height:58px; border-radius:16px; flex:none;
    background:linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative;
    box-shadow:var(--shadow-sm), inset 0 0 0 1px rgba(255,255,255,0.02);
    transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .app-tile:hover .app-icon-wrap{
    border-color:var(--block-color, var(--teal));
    box-shadow:var(--shadow-md), 0 0 0 1px var(--block-color, var(--teal));
  }
  .app-favicon{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .app-favicon.letter-fallback{
    display:flex; align-items:center; justify-content:center;
    width:100%; height:100%;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px;
    color:#0d1512; background:var(--block-color, var(--teal));
  }
  .app-tile-remove{
    position:absolute; top:-6px; right:-6px; width:19px; height:19px;
    border-radius:50%; background:var(--coral); color:#2a0d0d;
    border:2px solid var(--bg-panel); display:flex; align-items:center; justify-content:center;
    opacity:0; transform:scale(0.6); transition:opacity .12s, transform .12s;
    cursor:pointer; z-index:2;
  }
  .app-tile-edit{
    position:absolute; top:-6px; left:-6px; width:19px; height:19px;
    border-radius:50%; background:var(--blue); color:#0a1a2e;
    border:2px solid var(--bg-panel); display:flex; align-items:center; justify-content:center;
    opacity:0; transform:scale(0.6); transition:opacity .12s, transform .12s;
    cursor:pointer; z-index:2;
  }
  .app-tile:hover .app-tile-remove, .app-tile:hover .app-tile-edit{opacity:1; transform:scale(1);}
  @media (hover:none){
    .app-tile-remove, .app-tile-edit{opacity:1; transform:scale(1);}
  }
  .app-name{
    font-size:11.5px; font-weight:500; text-align:center; line-height:1.25;
    max-width:76px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; color:var(--text);
  }
  .app-empty{grid-column:1/-1; padding:12px 6px 16px; color:var(--text-faint); font-size:12.5px; text-align:center;}

  /* add app inline */
  .add-app{padding:10px; border-top:1px solid var(--border-soft); margin-top:6px;}
  .add-app-toggle{
    width:100%; background:none; border:1px dashed var(--border);
    color:var(--text-muted); border-radius:8px; padding:8px; font-size:12.5px;
    cursor:pointer; font-family:'Inter',sans-serif; transition:border-color .12s, color .12s;
  }
  .add-app-toggle:hover{border-color:var(--block-color,var(--teal)); color:var(--text);}
  .add-app-form{display:none; flex-direction:column; gap:7px; margin-top:8px;}
  .add-app-form.open{display:flex;}
  .add-app-form input{
    background:var(--bg-panel-2); border:1px solid var(--border);
    color:var(--text); border-radius:7px; padding:11px 12px; font-size:14px;
    min-height:42px;
    outline:none; font-family:'Inter',sans-serif; transition:border-color .15s var(--ease);
  }
  .add-app-form input:focus{border-color:var(--block-color,var(--teal));}
  .add-app-form-actions{display:flex; gap:8px;}
  .add-app-form-actions .btn{flex:1; justify-content:center; padding:10px; font-size:13px; min-height:42px;}

  /* ---------- Overlay (app viewer) ---------- */
  .overlay{
    position:fixed; inset:0; background:#0b0c10; z-index:100;
    display:none; flex-direction:column;
  }
  .overlay.open{display:flex;}
  .overlay-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(var(--safe-top) + 10px) max(18px, var(--safe-right)) 10px max(18px, var(--safe-left));
    background:#101319; border-bottom:1px solid var(--border-soft);
    flex:none;
  }
  .overlay-bar-left{display:flex; align-items:center; gap:10px; min-width:0;}
  .overlay-bar-left img{width:18px; height:18px; border-radius:4px;}
  .overlay-bar-left span{font-size:13px; color:var(--text-muted); font-family:'JetBrains Mono',monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .overlay iframe{flex:1; width:100%; border:none; background:#fff;}

  .fab-home{
    position:fixed; top:calc(var(--safe-top) + 18px); right:calc(var(--safe-right) + 18px); z-index:110;
    width:64px; height:64px; border-radius:50%;
    background:linear-gradient(150deg,var(--teal),#2f9c92);
    color:#08130f; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:10px;
    letter-spacing:0.5px;
    box-shadow:0 6px 20px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.08);
    transition:transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  .fab-home:hover{transform:translateY(-2px) scale(1.04); box-shadow:0 10px 26px rgba(0,0,0,0.5);}
  .fab-home:active{transform:scale(0.96);}

  .fallback-hint{
    padding:6px 18px; background:#191c22; color:var(--text-faint);
    font-size:11.5px; font-family:'JetBrains Mono',monospace; flex:none;
    border-bottom:1px solid var(--border-soft);
  }
  .fallback-hint a{color:var(--teal); text-decoration:none;}

  /* toast */
  .toast{
    position:fixed; bottom:calc(var(--safe-bottom) + 22px); left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--bg-panel-2); border:1px solid var(--border); color:var(--text);
    padding:10px 16px; border-radius:8px; font-size:13px; z-index:200;
    max-width:calc(100vw - 40px); text-align:center;
    box-shadow:var(--shadow-lg);
    opacity:0; pointer-events:none; transition:opacity .2s var(--ease), transform .2s var(--ease);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- Block tiles (visão principal — só blocos) ---------- */
  .block-tile{
    background:linear-gradient(160deg, var(--bg-panel), var(--bg-panel-2));
    border:1px solid var(--border);
    border-radius:18px;
    padding:26px 18px 20px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    cursor:pointer; position:relative;
    box-shadow:var(--shadow-sm);
    transition:transform .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .block-tile:hover{
    transform:translateY(-4px);
    border-color:var(--block-color, var(--teal));
    box-shadow:var(--shadow-lg), 0 0 0 1px var(--block-color, var(--teal));
  }
  .block-tile:active{transform:translateY(-1px);}
  .block-tile-icon{
    width:64px; height:64px; border-radius:18px; flex:none;
    background:linear-gradient(150deg, var(--block-color, var(--teal)), rgba(0,0,0,0.15));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px -2px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .block-tile-name{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;
    letter-spacing:0.3px; text-transform:uppercase; text-align:center;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .block-tile-count{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-faint);
  }
  .block-tile-remove{
    position:absolute; top:10px; right:10px; opacity:0;
    transition:opacity .12s;
  }
  .block-tile:hover .block-tile-remove{opacity:1;}

  /* ---------- Detail view header (dentro de um bloco) ---------- */
  .detail-header{
    max-width:1240px; margin:0 auto; padding:4px 28px 4px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .detail-header-left{display:flex; align-items:center; gap:12px; min-width:0;}
  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:none; border:1px solid var(--border); color:var(--text-muted);
    border-radius:8px; padding:8px 12px; cursor:pointer; font-size:13px;
    font-family:'Inter',sans-serif; transition:border-color .12s, color .12s;
  }
  .back-btn:hover{border-color:var(--teal); color:var(--text);}
  .detail-badge{display:flex; align-items:center; gap:9px; min-width:0;}
  .detail-led{width:10px; height:10px; border-radius:50%; flex:none; background:var(--block-color,var(--teal)); box-shadow:0 0 8px 1px var(--block-color,var(--teal));}
  .detail-title{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;
    text-transform:uppercase; letter-spacing:0.5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .detail-add-app{max-width:1240px; margin:6px auto 0; padding:0 28px;}
  .detail-add-app .add-app-toggle{max-width:280px;}
  .detail-add-app .add-app-form{max-width:340px;}

  .icon-upload-row{
    display:flex; align-items:center; gap:8px; margin-top:2px;
  }
  .icon-upload-preview{
    width:34px; height:34px; border-radius:8px; flex:none;
    background:var(--bg-panel-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); overflow:hidden;
  }
  .icon-upload-preview img{width:100%; height:100%; object-fit:cover;}
  .icon-upload-btn{
    flex:1; min-width:0;
    background:var(--bg-panel-2); border:1px dashed var(--border);
    color:var(--text-muted); border-radius:6px; padding:8px 10px; font-size:11.5px;
    cursor:pointer; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transition:border-color .12s, color .12s;
  }
  .icon-upload-btn:hover{border-color:var(--teal); color:var(--text);}
  .icon-upload-btn input[type=file]{display:none;}
  .icon-upload-clear{
    flex:none; width:24px; height:24px; border-radius:6px;
    background:none; border:1px solid var(--border); color:var(--text-faint);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:border-color .12s, color .12s;
  }
  .icon-upload-clear:hover{border-color:var(--coral); color:var(--coral);}

  /* ---------- Responsivo ---------- */
  @media (max-width:820px){
    .grid:not(.app-list){grid-template-columns:repeat(auto-fill,minmax(260px,1fr)) !important;}
  }

  @media (max-width:640px){
    .topbar{padding:calc(var(--safe-top) + 14px) 14px 12px;}
    .brand{gap:8px; margin-bottom:10px;}
    .install-label{display:none;}
    .install-btn-header{padding:10px; border-radius:50%; width:40px; height:40px; justify-content:center;}
    .install-btn-header svg{width:16px; height:16px;}
    .backup-actions{gap:6px;}
    .icon-only-btn{width:40px; height:40px;}
    .grid{padding:16px 14px 50px; gap:14px;}
    .grid[style*="minmax(160px"]{grid-template-columns:repeat(2, 1fr) !important;}
    .app-list{grid-template-columns:repeat(auto-fill,minmax(70px,1fr)) !important;}
    .fab-home{width:58px; height:58px; font-size:9.5px;}
    .new-block-panel, .detail-header, .detail-add-app{padding-left:14px; padding-right:14px;}
    .search-wrap{max-width:none;}
    .controls-row{flex-wrap:nowrap;}
    .new-block-form{flex-direction:column; align-items:stretch;}
    .new-block-form .swatches{justify-content:center; padding:4px 0;}
  }

  @media (max-width:380px){
    .brand h1{letter-spacing:0.5px;}

</style>

<body>

        </div>

    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#08130f" stroke-width="2.4"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/></svg>
    HOME
  </button>

  <div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'launcher-dashboard-v1';
const COLORS = [
  {name:'teal', hex:'#4fd1c5'},
  {name:'amber', hex:'#f2a65a'},
  {name:'violet', hex:'#9b8cff'},
  {name:'coral', hex:'#ff7a7a'},
  {name:'lime', hex:'#b8e986'},
  {name:'blue', hex:'#6fa8ff'},
];

let state = { blocks: [] };
let selectedNewBlockColor = COLORS[0].hex;
let filterText = '';
let currentView = 'blocks';   // 'blocks' | 'detail'
let currentBlockId = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function normalizeUrl(u){
  u = u.trim();
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}
function hostOf(u){
  try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return u; }
}
function faviconOf(u){
  try{
    const h = new URL(u).hostname;
    return `https://www.google.com/s2/favicons?sz=128&domain=${h}`;
  }catch(e){ return ''; }
}
function clearbitOf(u){
  try{
    const h = new URL(u).hostname.replace(/^www\./,'');
    return `https://logo.clearbit.com/${h}?size=128`;
  }catch(e){ return ''; }
}

/* ---------- Sincronização com Firebase ----------
   Quando as credenciais do Firebase estiverem configuradas (ver bloco
   <script type="module"> no fim do arquivo), os dados ficam salvos na
   nuvem (Firestore) e sincronizam automaticamente entre todos os
   aparelhos. Sem Firebase configurado, o app funciona normalmente
   salvando só neste navegador (localStorage). */
let firebaseActive = false;

let resolveSyncMode;
const syncModePromise = new Promise((res) => { resolveSyncMode = res; });
window.addEventListener('firebase-ready', () => resolveSyncMode('firebase'));
window.addEventListener('firebase-unavailable', () => resolveSyncMode('local'));
// segurança: se por algum motivo nenhum evento disparar, não trava o app
setTimeout(() => resolveSyncMode('local'), 4000);

function updateSyncStatus(isCloud, isError){
  const lamp = document.querySelector('.brand .lamp');
  if(!lamp) return;
  lamp.classList.add('pulse');
  if(isError){
    lamp.style.background = 'var(--coral)';
    lamp.style.boxShadow = '0 0 8px 2px rgba(255,122,122,0.55)';
    lamp.title = 'Erro ao sincronizar com a nuvem — salvando só neste aparelho';
  } else if(isCloud){
    lamp.style.background = 'var(--teal)';
    lamp.style.boxShadow = '0 0 8px 2px rgba(79,209,197,0.65)';
    lamp.title = 'Sincronizado na nuvem (Firebase) — mesmos apps em todos os aparelhos';
  } else {
    lamp.style.background = 'var(--amber)';
    lamp.style.boxShadow = '0 0 8px 2px rgba(242,166,90,0.55)';
    lamp.title = 'Salvando apenas neste aparelho (sincronização não configurada)';
  }
}

/* ---------- Armazenamento local (cache / fallback) ----------
   Usa window.storage quando disponível (preview dentro do Claude.ai),
   e localStorage como mecanismo real quando o site está publicado. */
function hasClaudeStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}

async function storageReadRaw(){
  if(hasClaudeStorage()){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value) return res.value;
    }catch(e){ /* segue para localStorage */ }
  }
  try{ return localStorage.getItem(STORAGE_KEY); }catch(e){ return null; }
}

async function storageWriteRaw(value){
  let ok = false;
  if(hasClaudeStorage()){
    try{ await window.storage.set(STORAGE_KEY, value, false); ok = true; }catch(e){ /* segue para localStorage */ }
  }
  try{ localStorage.setItem(STORAGE_KEY, value); ok = true; }catch(e){ /* localStorage indisponível */ }
  return ok;
}

async function loadState(){
  const mode = await syncModePromise;

  if(mode === 'firebase' && window.firebaseBridge && window.firebaseBridge.enabled){
    firebaseActive = true;
    window.firebaseBridge.subscribe(async (remoteState) => {
      if(remoteState && Array.isArray(remoteState.blocks)){
        state = remoteState;
      } else {
        // Documento ainda não existe na nuvem: migra o que já tinha localmente (se houver)
        try{
          const raw = await storageReadRaw();
          state = raw ? JSON.parse(raw) : seedDefault();
        }catch(e){ state = seedDefault(); }
        window.firebaseBridge.save(state).catch(()=>{});
      }
      await storageWriteRaw(JSON.stringify(state));
      render();
      updateSyncStatus(true);
    }, (err) => {
      console.error('Firestore erro:', err);
      updateSyncStatus(false, true);
    });
  } else {
    firebaseActive = false;
    try{
      const raw = await storageReadRaw();
      if(raw){
        state = JSON.parse(raw);
      } else {
        state = seedDefault();
        await saveState();
      }
    }catch(e){
      state = seedDefault();
      await saveState();
    }
    render();
    updateSyncStatus(false);
  }
}

function seedDefault(){
  return { blocks: [
    { id: uid(), name:'Jogos', color: COLORS[3].hex, apps: [] },
    { id: uid(), name:'Escola', color: COLORS[5].hex, apps: [] },
    { id: uid(), name:'Profissional', color: COLORS[0].hex, apps: [] },
  ]};
}

async function saveState(){
  const ok = await storageWriteRaw(JSON.stringify(state));
  if(!ok){
    showToast('Não foi possível salvar localmente. Verifique o espaço do navegador.');
  }
  if(firebaseActive && window.firebaseBridge){
    try{
      await window.firebaseBridge.save(state);
      updateSyncStatus(true);
    }catch(e){
      console.error('Falha ao salvar no Firestore:', e);
      updateSyncStatus(false, true);
      showToast('Sem conexão com a nuvem — salvo só neste aparelho por enquanto.');
    }
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tid);
  showToast._tid = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------- render ---------- */
function render(){
  const detailHeader = document.getElementById('detailHeader');
  const controlsBlocks = document.getElementById('controlsBlocks');
  const detailAddApp = document.getElementById('detailAddApp');

  if(currentView === 'detail'){
    detailHeader.style.display = 'flex';
    controlsBlocks.style.display = 'none';
    detailAddApp.style.display = 'block';
    renderDetailView();
  } else {
    detailHeader.style.display = 'none';
    controlsBlocks.style.display = 'flex';
    detailAddApp.style.display = 'none';
    renderBlocksView();
  }
}

function renderBlocksView(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  grid.className = 'grid';
  grid.style.maxWidth = '';
  grid.innerHTML = '';

  if(state.blocks.length === 0){
    empty.style.display = 'block';
    grid.style.display = 'none';
    return;
  }

  const q = filterText.trim().toLowerCase();
  const visibleBlocks = q ? state.blocks.filter(b => b.name.toLowerCase().includes(q)) : state.blocks;

  if(visibleBlocks.length === 0){
    empty.style.display = 'block';
    grid.style.display = 'none';
    document.querySelector('#emptyState h2').textContent = 'Nenhum bloco encontrado';
    document.querySelector('#emptyState p').textContent = 'Tente buscar por outro nome.';
    return;
  }
  document.querySelector('#emptyState h2').textContent = 'Seu painel está vazio';
  document.querySelector('#emptyState p').textContent = 'Crie um bloco (categoria) para começar a organizar seus aplicativos.';
  empty.style.display = 'none';
  grid.style.display = 'grid';
  grid.style.gridTemplateColumns = 'repeat(auto-fill,minmax(160px,1fr))';

  grid.innerHTML = visibleBlocks.map(block => `
    <div class="block-tile" style="--block-color:${block.color}" onclick="openBlock('${block.id}')">
      <button class="icon-btn block-tile-remove" title="Excluir bloco" onclick="event.stopPropagation(); deleteBlock('${block.id}')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
      </button>
      <div class="block-tile-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0d1512" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
      </div>
      <div class="block-tile-name" title="${escapeHtml(block.name)}">${escapeHtml(block.name)}</div>
      <div class="block-tile-count">${block.apps.length} app${block.apps.length===1?'':'s'}</div>
    </div>
  `).join('');
}

function renderDetailView(){
  const block = state.blocks.find(b=>b.id===currentBlockId);
  if(!block){ goToBlocks(); return; }

  document.getElementById('detailLed').style.background = block.color;
  document.getElementById('detailLed').style.boxShadow = `0 0 8px 1px ${block.color}`;
  document.getElementById('detailTitle').textContent = block.name;

  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  grid.style.gridTemplateColumns = '';
  grid.className = 'grid app-list';
  grid.style.maxWidth = '1240px';

  const q = filterText.trim().toLowerCase();
  const visibleApps = q ? block.apps.filter(a => a.name.toLowerCase().includes(q)) : block.apps;

  if(block.apps.length === 0){
    empty.style.display = 'none';
    grid.style.display = 'grid';
    grid.innerHTML = `<div class="app-empty">Nenhum aplicativo cadastrado neste bloco ainda.</div>`;
    return;
  }
  empty.style.display = 'none';
  grid.style.display = 'grid';
  grid.innerHTML = visibleApps.length
    ? visibleApps.map(app => appRowHtml(block, app)).join('')
    : `<div class="app-empty">Nenhum aplicativo encontrado</div>`;
}

function openBlock(blockId){
  currentView = 'detail';
  currentBlockId = blockId;
  filterText = '';
  document.getElementById('searchInput') && (document.getElementById('searchInput').value = '');
  const f = document.getElementById('addAppForm');
  if(f) f.classList.remove('open');
  clearIconUpload();
  editingAppId = null;
  setAddAppFormMode(false);
  render();
}
function goToBlocks(){
  currentView = 'blocks';
  currentBlockId = null;
  render();
}
function deleteCurrentBlock(){
  if(currentBlockId) deleteBlock(currentBlockId, true);
}

function appRowHtml(block, app){
  const letter = (app.name.trim()[0] || '?').toUpperCase();
  const primarySrc = app.icon ? app.icon : clearbitOf(app.url);
  const fallbackSrc = faviconOf(app.url);
  return `
    <div class="app-tile" onclick="openApp('${app.id}','${block.id}')" title="${escapeHtml(app.name)}">
      <div class="app-tile-edit" title="Editar app" onclick="event.stopPropagation(); openEditApp('${block.id}','${app.id}')">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </div>
      <div class="app-tile-remove" title="Excluir app" onclick="event.stopPropagation(); deleteApp('${block.id}','${app.id}')">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
      <div class="app-icon-wrap">
        <img class="app-favicon" src="${primarySrc}" alt=""
          data-fallback="${fallbackSrc}" data-letter="${letter}"
          onerror="handleIconError(this)">
      </div>
      <div class="app-name">${escapeHtml(app.name)}</div>
    </div>
  `;
}

function handleIconError(img){
  const stage = img.dataset.stage || '0';
  if(stage === '0'){
    img.dataset.stage = '1';
    img.src = img.dataset.fallback;
  } else {
    const div = document.createElement('div');
    div.className = 'app-favicon letter-fallback';
    div.textContent = img.dataset.letter;
    img.replaceWith(div);
  }
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ---------- block actions ---------- */
function buildSwatches(){
  const wrap = document.getElementById('newBlockSwatches');
  wrap.innerHTML = COLORS.map((c,i)=>`<div class="swatch ${i===0?'active':''}" style="background:${c.hex}" data-hex="${c.hex}" onclick="selectSwatch(this)"></div>`).join('');
}
function selectSwatch(el){
  document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  selectedNewBlockColor = el.dataset.hex;
}
function toggleNewBlockForm(){
  const f = document.getElementById('newBlockForm');
  f.classList.toggle('open');
  if(f.classList.contains('open')){
    document.getElementById('newBlockName').value='';
    document.getElementById('newBlockName').focus();
  }
}
async function createBlock(){
  const nameInput = document.getElementById('newBlockName');
  const name = nameInput.value.trim();
  if(!name){ showToast('Dê um nome ao bloco.'); nameInput.focus(); return; }
  state.blocks.push({ id: uid(), name, color: selectedNewBlockColor, apps: [] });
  await saveState();
  toggleNewBlockForm();
  render();
  showToast(`Bloco "${name}" criado.`);
}
async function deleteBlock(id, fromDetail){
  const block = state.blocks.find(b=>b.id===id);
  if(!block) return;
  if(!confirm(`Excluir o bloco "${block.name}" e todos os seus ${block.apps.length} aplicativo(s)?`)) return;
  state.blocks = state.blocks.filter(b=>b.id!==id);
  await saveState();
  if(fromDetail){ goToBlocks(); } else { render(); }
}

/* ---------- app actions ---------- */
let pendingIconDataUrl = null;
let editingAppId = null;

function setAddAppFormMode(isEditing){
  const toggleBtn = document.querySelector('.add-app-toggle');
  const submitBtn = document.querySelector('#addAppForm .add-app-form-actions .btn-primary');
  if(isEditing){
    if(submitBtn) submitBtn.textContent = 'Salvar alterações';
    if(toggleBtn) toggleBtn.textContent = '✎ Editando aplicativo';
  } else {
    if(submitBtn) submitBtn.textContent = 'Adicionar';
    if(toggleBtn) toggleBtn.textContent = '+ Cadastrar aplicativo';
  }
}

function toggleAddApp(){
  const f = document.getElementById('addAppForm');
  const wasOpen = f.classList.contains('open');
  f.classList.toggle('open');
  if(f.classList.contains('open')){
    document.getElementById('appName').focus();
  } else {
    clearIconUpload();
    document.getElementById('appName').value = '';
    document.getElementById('appUrl').value = '';
    editingAppId = null;
    setAddAppFormMode(false);
  }
}

function openEditApp(blockId, appId){
  const block = state.blocks.find(b=>b.id===blockId);
  const app = block && block.apps.find(a=>a.id===appId);
  if(!app) return;

  editingAppId = appId;

  const f = document.getElementById('addAppForm');
  f.classList.add('open');

  document.getElementById('appName').value = app.name;
  document.getElementById('appUrl').value = app.url;

  clearIconUpload();
  if(app.icon && app.icon.startsWith('data:')){
    // ícone enviado do dispositivo: mantém como upload pendente
    pendingIconDataUrl = app.icon;
    const preview = document.getElementById('iconUploadPreview');
    preview.innerHTML = `<img src="${app.icon}" alt="">`;
    document.getElementById('iconUploadClear').style.display = 'flex';
    const iconField = document.getElementById('appIcon');
    iconField.disabled = true;
    iconField.placeholder = 'Imagem selecionada do dispositivo';
  } else if(app.icon){
    document.getElementById('appIcon').value = app.icon;
  }

  setAddAppFormMode(true);
  document.getElementById('appName').focus();
  document.getElementById('addAppForm').scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function handleIconFile(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){
    showToast('Escolha um arquivo de imagem.');
    event.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      // Redimensiona/recorta para um ícone quadrado leve (128x128)
      const size = 128;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const side = Math.min(img.width, img.height);
      const sx = (img.width - side) / 2;
      const sy = (img.height - side) / 2;
      ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
      pendingIconDataUrl = canvas.toDataURL('image/png');

      const preview = document.getElementById('iconUploadPreview');
      preview.innerHTML = `<img src="${pendingIconDataUrl}" alt="">`;
      document.getElementById('iconUploadClear').style.display = 'flex';

      const iconField = document.getElementById('appIcon');
      iconField.value = '';
      iconField.disabled = true;
      iconField.placeholder = 'Imagem selecionada do dispositivo';
    };
    img.onerror = () => showToast('Não foi possível ler essa imagem.');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function clearIconUpload(){
  pendingIconDataUrl = null;
  const fileInput = document.getElementById('appIconFile');
  if(fileInput) fileInput.value = '';
  const preview = document.getElementById('iconUploadPreview');
  if(preview) preview.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`;
  const clearBtn = document.getElementById('iconUploadClear');
  if(clearBtn) clearBtn.style.display = 'none';
  const iconField = document.getElementById('appIcon');
  if(iconField){ iconField.disabled = false; iconField.placeholder = 'URL do ícone (opcional)'; iconField.value = ''; }
}

async function addApp(){
  const block = state.blocks.find(b=>b.id===currentBlockId);
  if(!block) return;
  const nameEl = document.getElementById('appName');
  const urlEl = document.getElementById('appUrl');
  const iconEl = document.getElementById('appIcon');
  const name = nameEl.value.trim();
  let url = urlEl.value.trim();
  let icon = pendingIconDataUrl || iconEl.value.trim();
  if(!name || !url){ showToast('Preencha nome e URL.'); return; }
  url = normalizeUrl(url);
  if(icon && !icon.startsWith('data:')) icon = normalizeUrl(icon);

  if(editingAppId){
    const app = block.apps.find(a=>a.id===editingAppId);
    if(app){
      app.name = name; app.url = url; app.icon = icon || null;
    }
    editingAppId = null;
    setAddAppFormMode(false);
    nameEl.value = ''; urlEl.value = '';
    clearIconUpload();
    document.getElementById('addAppForm').classList.remove('open');
    await saveState();
    render();
    showToast(`"${name}" atualizado.`);
  } else {
    block.apps.push({ id: uid(), name, url, icon: icon || null });
    nameEl.value = ''; urlEl.value = '';
    clearIconUpload();
    await saveState();
    render();
    showToast(`"${name}" cadastrado em ${block.name}.`);
  }
}
async function deleteApp(blockId, appId){
  const block = state.blocks.find(b=>b.id===blockId);
  if(!block) return;
  block.apps = block.apps.filter(a=>a.id!==appId);
  if(editingAppId === appId){
    editingAppId = null;
    setAddAppFormMode(false);
    document.getElementById('addAppForm').classList.remove('open');
  }
  await saveState();
  render();
}

/* ---------- overlay / open app ---------- */
function openApp(appId, blockId){
  const block = state.blocks.find(b=>b.id===blockId);
  const app = block && block.apps.find(a=>a.id===appId);
  if(!app) return;
  document.getElementById('overlayIframe').src = app.url;
  document.getElementById('overlayUrl').textContent = `${app.name} — ${hostOf(app.url)}`;
  document.getElementById('overlayFavicon').src = app.icon ? app.icon : clearbitOf(app.url);
  document.getElementById('overlayFavicon').onerror = function(){ this.onerror=null; this.src = faviconOf(app.url); };
  document.getElementById('overlayNewTab').href = app.url;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('fabHome').style.display = 'flex';
}
function closeOverlay(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('fabHome').style.display = 'none';
  document.getElementById('overlayIframe').src = 'about:blank';
}

/* ---------- PWA: botão Instalar / Instalado ---------- */
let deferredInstallPrompt = null;

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function setInstallButtonState(installed){
  const btn = document.getElementById('installBtn');
  if(!btn) return;
  if(installed){
    btn.classList.add('installed');
    btn.disabled = true;
    btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg><span class="install-label">Instalado</span>`;
  } else {
    btn.classList.remove('installed');
    btn.disabled = false;
    btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M5 19h14"/></svg><span class="install-label">Instalar</span>`;
  }
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  setInstallButtonState(false);
});

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  setInstallButtonState(true);
  showToast('Instalado com sucesso.');
});

async function handleInstallClick(){
  if(isStandalone()) return;

  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice;
    if(choice.outcome === 'accepted') setInstallButtonState(true);
    deferredInstallPrompt = null;
    return;
  }

  const ua = navigator.userAgent;
  if(/iphone|ipad|ipod/i.test(ua)){
    showToast('No iPhone: toque em Compartilhar e depois em "Adicionar à Tela de Início".');
  } else {
    showToast('Use o menu (⋮) do navegador e escolha "Instalar aplicativo".');
  }
}

setInstallButtonState(isStandalone());
